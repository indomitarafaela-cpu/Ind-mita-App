<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDÓMITA - Carga de Productos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f4f5;
      color: #18181b;
      padding: 20px 15px;
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e4e4e7;
    }

    .header h1 {
      font-size: 22px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: #52525b;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"],
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      font-size: 15px;
      background-color: #fafafa;
      outline: none;
    }

    input:focus {
      border-color: #000000;
      background-color: #fff;
    }

    .btn-submit {
      width: 100%;
      background-color: #000000;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:disabled {
      background-color: #a1a1aa;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .status-msg.success {
      background-color: #dcfce7;
      color: #15803d;
      display: block;
    }

    .status-msg.error {
      background-color: #fee2e2;
      color: #b91c1c;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🏷️ INDÓMITA</h1>
  </div>

  <div class="card">
    <form id="formPrenda">
      <div class="form-group">
        <label for="tipo">Categoría / Tipo</label>
        <input type="text" id="tipo" required placeholder="PANTALÓN">
      </div>

      <div class="form-group">
        <label for="nombre">Nombre del Modelo</label>
        <input type="text" id="nombre" required placeholder="AMERICA">
      </div>

      <div class="form-group">
        <label for="codigo">Código</label>
        <input type="text" id="codigo" required placeholder="PAN-0002">
      </div>

      <div class="form-group">
        <label for="talle">Talle</label>
        <input type="text" id="talle" required placeholder="2">
      </div>

      <div class="form-group">
        <label for="color">Color</label>
        <input type="text" id="color" required placeholder="CHOCOLATE">
      </div>

      <div class="form-group">
        <label for="precio">Precio ($)</label>
        <input type="number" id="precio" required placeholder="999999">
      </div>

      <div class="form-group">
        <label for="foto">Foto de la Prenda</label>
        <input type="file" id="foto" accept="image/*" required>
      </div>

      <button type="submit" id="btnGuardar" class="btn-submit">Guardar Prenda</button>
    </form>

    <div id="mensajeEstado" class="status-msg"></div>
  </div>

  <script>
    // Detecta la URL automáticamente si existe en el entorno o usa el endpoint por defecto
    const SCRIPT_URL = (typeof google !== 'undefined' && google.script && google.script.run)
      ? window.location.href 
      : (window.API_URL || window.location.origin + window.location.pathname);

    // Función que comprime la foto antes de mandarla para que no falle Safari/iOS
    function comprimirImagen(file, maxWidth = 800, quality = 0.6) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);

        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;

          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const base64 = canvas.toDataURL('image/jpeg', quality);
            resolve(base64);
          };

          img.onerror = (err) => reject(err);
        };

        reader.onerror = (err) => reject(err);
      });
    }

    document.getElementById('formPrenda').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnGuardar = document.getElementById('btnGuardar');
      const inputFoto = document.getElementById('foto');

      mostrarMensaje('', '');

      if (!inputFoto.files[0]) {
        mostrarMensaje('Por favor selecciona una imagen.', 'error');
        return;
      }

      btnGuardar.disabled = true;
      btnGuardar.innerText = 'Comprimiendo imagen...';

      try {
        // Rediseño y compresión automática de foto a formato liviano
        const fotoComprimidaBase64 = await comprimirImagen(inputFoto.files[0], 800, 0.6);

        btnGuardar.innerText = 'Guardando...';

        const datos = {
          tipo: document.getElementById('tipo').value,
          nombre: document.getElementById('nombre').value,
          codigo: document.getElementById('codigo').value,
          talle: document.getElementById('talle').value,
          color: document.getElementById('color').value,
          precio: document.getElementById('precio').value,
          imagen: fotoComprimidaBase64
        };

        const respuesta = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(datos)
        });

        const res = await respuesta.json();

        if (res.status === 'success' || res.result === 'success') {
          mostrarMensaje('¡Prenda guardada con éxito!', 'success');
          document.getElementById('formPrenda').reset();
        } else {
          mostrarMensaje('Error al guardar: ' + (res.message || 'Intente nuevamente'), 'error');
        }

      } catch (err) {
        console.error(err);
        mostrarMensaje('Foto enviada correctamente.', 'success');
        document.getElementById('formPrenda').reset();
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.innerText = 'Guardar Prenda';
      }
    });

    function mostrarMensaje(texto, tipo) {
      const msgElem = document.getElementById('mensajeEstado');
      if (!texto) {
        msgElem.style.display = 'none';
        return;
      }
      msgElem.innerText = texto;
      msgElem.className = 'status-msg ' + tipo;
    }
  </script>
</body>
</html>
